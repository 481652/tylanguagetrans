<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TY语加密器 - 网页版</title>
  <style>
:root{--canvas:#f2f2f2;--surface:#fff;--ink:#181818;--muted:#666;--line:#d2d2d2;--blue:#0067c0;--blue-hover:#005a9e;--cyan:#00a4ef;--navy:#004e8c;--green:#10893e;--red:#d13438;--focus:#000}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--canvas)}
body{font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;background:var(--canvas);color:var(--ink);min-height:100vh;line-height:1.35}
button,input,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1440px;margin:0 auto;padding:34px 42px 24px;min-height:100vh;display:flex;flex-direction:column}
.header{position:relative;margin-bottom:28px;padding-left:20px;border-left:8px solid var(--blue)}
.header h1{font-size:clamp(2rem,4vw,3.5rem);font-weight:300;line-height:1;letter-spacing:-.045em}
.version{display:inline-block;margin-left:10px;padding:6px 9px;background:var(--blue);color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.08em;vertical-align:middle;text-transform:uppercase}
.subtitle{margin-top:11px;color:var(--muted);font-size:.98rem}
.main{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;flex:1}
.sidebar,.content-area{min-width:0}
.content-area{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);padding:22px}
.panel h2{margin-bottom:21px;color:var(--ink);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.panel h2::after{content:"";display:block;width:32px;height:3px;margin-top:9px;background:var(--blue)}
.keys-panel{height:100%;display:flex;flex-direction:column;gap:18px;border-top:7px solid var(--navy)}
.session-list-wrap>label,.algo-section>label:first-child{display:block;margin-bottom:8px;color:var(--muted);font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.session-list{min-height:128px;max-height:250px;overflow-y:auto;list-style:none;background:#e9e9e9;border:0}
.session-list:empty::after{content:"尚无会话";display:block;padding:18px;color:#777;font-size:.86rem}
.session-list li{position:relative;padding:12px 13px 12px 17px;cursor:pointer;font-size:.92rem;border-bottom:1px solid #fff;transition:background .12s,color .12s}
.session-list li::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:transparent}
.session-list li:hover{background:#d8d8d8}
.session-list li.active{background:var(--blue);color:#fff}
.session-list li.active::before{background:#fff}
.main-panel{display:flex;flex-direction:column;min-height:520px;border-top:7px solid var(--cyan)}
.main-panel textarea{width:100%;flex:1;min-height:360px;padding:18px;background:#fafafa;border:1px solid #a6a6a6;border-radius:0;color:#111;font-family:"Cascadia Mono","Microsoft YaHei UI",monospace;font-size:.94rem;line-height:1.65;resize:vertical;caret-color:var(--blue)}
.main-panel textarea:hover{border-color:#666}
.main-panel textarea:focus{outline:2px solid var(--blue);outline-offset:-2px;background:#fff;border-color:var(--blue)}
.panel-footer{display:flex;justify-content:flex-end;margin-top:10px}
.char-count{padding:4px 8px;background:#e8e8e8;color:#555;font-size:.76rem;font-variant-numeric:tabular-nums}
.controls-panel{border-top:7px solid var(--green)}
.radio-group{display:flex;flex-direction:column;gap:1px;margin-bottom:14px;background:#ddd}
.radio-label,.checkbox-label{position:relative;display:flex;align-items:center;gap:10px;padding:11px;background:#f3f3f3;font-size:.86rem;cursor:pointer;transition:background .12s}
.radio-label:hover,.checkbox-label:hover{background:#e3e3e3}
.radio-label:has(input:checked){background:var(--navy);color:#fff}
.radio-label input,.checkbox-label input{width:16px;height:16px;accent-color:var(--blue)}
.checkbox-label{margin-bottom:20px;border-left:4px solid var(--cyan)}
.checkbox-label:has(input:disabled){color:#777;cursor:default}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.session-list-wrap>.btn-group{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:6px}
.session-list-wrap>.btn-group .btn{width:100%;min-width:0;padding-inline:8px;white-space:nowrap}
.btn-group.vertical{display:grid;grid-template-columns:1fr}
.btn{min-height:39px;padding:9px 13px;border:0;border-radius:0;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .12s,box-shadow .12s,transform .08s}
.btn:hover{box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hover)}
.btn-secondary{background:#dedede;color:#181818}
.btn-secondary:hover{background:#cacaca}
#btnEncrypt{background:var(--green)}
#btnEncrypt:hover{background:#0c7535}
#btnDecrypt{background:var(--blue)}
#btnClear,#btnDelSession{color:#8b1a1d}
.full-width{width:100%;margin-top:8px}
.key-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;padding-top:5px}
.key-actions #btnGenKeys{grid-column:1/-1;min-height:52px;background:var(--navy)}
.footer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 24px;margin-top:12px;padding:14px 16px;background:#252525;color:#d6d6d6;font-size:.78rem}
.status{position:relative;padding-left:17px;font-weight:600}
.status::before{content:"";position:absolute;left:0;top:.28em;width:8px;height:8px;background:var(--green)}
.warning{grid-column:1/-1;color:#aaa;font-size:.72rem}
.credit{grid-column:2;grid-row:1;color:#fff;text-decoration:none;border-bottom:2px solid var(--cyan)}
.credit:hover{color:#7fdbff}
@media(max-width:1000px){.app{padding:26px 24px 20px}.main{grid-template-columns:220px minmax(0,1fr)}.content-area{grid-template-columns:1fr}.controls-panel{display:grid;grid-template-columns:minmax(190px,1fr) minmax(210px,1fr);gap:0 20px}.controls-panel h2{grid-column:1/-1}.controls-panel>.full-width{align-self:end}.main-panel{min-height:460px}}
@media(max-width:720px){.app{padding:22px 14px 14px}.header{margin-bottom:20px;padding-left:13px;border-left-width:6px}.header h1{font-size:2.35rem}.version{display:table;margin:11px 0 0;padding:5px 7px}.main{display:flex;flex-direction:column}.content-area{display:flex;flex-direction:column}.panel{padding:18px}.keys-panel{height:auto}.session-list{max-height:180px}.key-actions{margin-top:0}.main-panel{min-height:440px;order:1}.main-panel textarea{min-height:300px}.controls-panel{order:0;display:block}.controls-panel .btn-group.vertical{grid-template-columns:1fr 1fr}.footer{grid-template-columns:1fr}.credit{grid-column:1;grid-row:auto;justify-self:start}.warning{grid-column:1}}
@media(max-width:400px){.controls-panel .btn-group.vertical,.key-actions{grid-template-columns:1fr}.key-actions #btnGenKeys{grid-column:1}.footer{padding:13px}.header h1{font-size:2rem}}
@media(prefers-color-scheme:dark){:root{--canvas:#111;--surface:#202020;--ink:#f4f4f4;--muted:#aaa;--line:#3d3d3d;--focus:#fff}.session-list{background:#292929}.session-list li{border-bottom-color:#3c3c3c}.session-list li:hover{background:#383838}.main-panel textarea{background:#181818;border-color:#555;color:#f4f4f4}.main-panel textarea:hover{border-color:#888}.main-panel textarea:focus{background:#181818}.char-count,.btn-secondary{background:#383838;color:#eee}.btn-secondary:hover{background:#4a4a4a}.radio-group{background:#333}.radio-label,.checkbox-label{background:#292929}.radio-label:hover,.checkbox-label:hover{background:#393939}.checkbox-label:has(input:disabled){color:#aaa}}
  </style>

<body>
  <div class="app">
    <header class="header">
      <h1>TY语加密器 <span class="version">网页版 3.0</span></h1>
      <p class="subtitle">与桌面版双端互通 · 加密内容可互相加解密</p>
    </header>
    <main class="main">
      <aside class="sidebar">
        <section class="panel keys-panel">
          <h2>密钥管理</h2>
          <div class="session-list-wrap">
            <label>会话</label>
            <ul id="sessionList" class="session-list"></ul>
            <div class="btn-group">
              <button type="button" id="btnAddSession" class="btn btn-secondary">保存会话</button>
              <button type="button" id="btnDelSession" class="btn btn-secondary">删除会话</button>
            </div>
          </div>
          <div class="btn-group vertical">
            <button type="button" id="btnImportSession" class="btn btn-secondary">导入会话</button>
            <button type="button" id="btnExportSession" class="btn btn-secondary">导出会话</button>
          </div>
          <div class="key-actions">
            <button type="button" id="btnImportPub" class="btn btn-secondary">导入公钥</button>
            <button type="button" id="btnImportPriv" class="btn btn-secondary">导入私钥</button>
            <button type="button" id="btnGenKeys" class="btn btn-primary">生成密钥对</button>
          </div>
        </section>
      </aside>
      <section class="content-area">
        <div class="panel main-panel">
          <h2>内容管理</h2>
          <textarea id="txtMain" placeholder="在此输入明文或 TY 语密文..." rows="12"></textarea>
          <div class="panel-footer"><span id="charCount" class="char-count">字符数：0</span></div>
        </div>
        <div class="panel controls-panel">
          <h2>操作</h2>
          <div class="algo-section">
            <label>算法选择</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="algo" value="x25519" checked> 3.0 全新算法</label>
              <label class="radio-label"><input type="radio" name="algo" value="rsa"> 2.2 旧版算法</label>
            </div>
            <label class="checkbox-label"><input type="checkbox" id="chkCompress" checked disabled> 压缩密文长度</label>
          </div>
          <div class="btn-group vertical">
            <button type="button" id="btnEncrypt" class="btn btn-primary">加密</button>
            <button type="button" id="btnDecrypt" class="btn btn-primary">解密</button>
            <button type="button" id="btnCopy" class="btn btn-secondary">复制结果</button>
            <button type="button" id="btnClear" class="btn btn-secondary">清空</button>
          </div>
          <button type="button" id="btnSavePreset" class="btn btn-secondary full-width">保存预设</button>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="status" id="statusBar">就绪</div>
      <p class="warning">会话私钥仅保存在当前浏览器中，请使用密码导出备份。本工具严禁用于违法活动。</p>
      <a href="https://lcs123.top" target="_blank" rel="noopener" class="credit">By LCS 2020-2026</a>
    </footer>
  </div>
  <input type="file" id="fileImport" accept=".tysess" hidden>
  <input type="file" id="fileImportPub" accept=".xml,.txt" hidden>
  <input type="file" id="fileImportPriv" accept=".xml,.txt" hidden>
