<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TY语加密器 - 网页版</title>
  <style>
:root{--bg-dark:#0f1419;--bg-panel:#1a2332;--bg-input:#243447;--accent:#1d9bf0;--accent-hover:#1a8cd8;--text:#e7e9ea;--text-muted:#8b98a5;--border:#38444d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;background:var(--bg-dark);color:var(--text);min-height:100vh;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.5rem;min-height:100vh;display:flex;flex-direction:column}
.header{text-align:center;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.header h1{font-size:1.75rem;font-weight:600;margin-bottom:0.25rem}
.version{font-size:0.85rem;color:var(--accent);font-weight:500}
.subtitle{color:var(--text-muted);font-size:0.9rem}
.main{display:flex;gap:1.5rem;flex:1}
.sidebar{flex-shrink:0;width:200px}
.content-area{flex:1;display:flex;gap:1.5rem;min-width:0}
.panel{background:var(--bg-panel);border-radius:12px;padding:1.25rem;border:1px solid var(--border)}
.panel h2{font-size:0.95rem;color:var(--text-muted);margin-bottom:1rem;font-weight:500}
.keys-panel{display:flex;flex-direction:column;gap:1rem}
.session-list-wrap label,.algo-section label{display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.4rem}
.session-list{list-style:none;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg-input)}
.session-list li{padding:0.5rem 0.75rem;cursor:pointer;font-size:0.9rem;border-bottom:1px solid var(--border);transition:background 0.15s}
.session-list li:last-child{border-bottom:none}
.session-list li:hover{background:rgba(29,155,240,0.1)}
.session-list li.active{background:rgba(29,155,240,0.2);color:var(--accent)}
.main-panel{flex:1;display:flex;flex-direction:column;min-width:0}
.main-panel textarea{width:100%;flex:1;min-height:200px;padding:1rem;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:monospace;font-size:0.9rem;resize:vertical}
.main-panel textarea:focus{outline:none;border-color:var(--accent)}
.panel-footer{margin-top:0.5rem}
.char-count{font-size:0.85rem;color:var(--text-muted)}
.controls-panel{flex-shrink:0;width:180px}
.radio-group{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem}
.radio-label,.checkbox-label{display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;cursor:pointer}
.checkbox-label{margin-bottom:1rem}
.checkbox-label input:disabled{opacity:0.5;cursor:not-allowed}
.btn-group{display:flex;gap:0.5rem;flex-wrap:wrap}
.btn-group.vertical{flex-direction:column}
.btn-group.vertical .btn{width:100%}
.btn{padding:0.6rem 1rem;border:none;border-radius:8px;font-size:0.9rem;font-family:inherit;cursor:pointer;transition:background 0.15s,transform 0.1s}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--bg-input);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:#2d3d4d}
.full-width{width:100%;margin-top:0.5rem}
.key-actions{margin-top:auto;padding-top:0.5rem}
.footer{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);text-align:center;font-size:0.85rem;color:var(--text-muted)}
.status{margin-bottom:0.5rem}
.warning{color:var(--text-muted);margin-bottom:0.5rem;font-size:0.8rem}
.credit{color:#5e50ce;text-decoration:none}
.credit:hover{text-decoration:underline}
@media(max-width:768px){.main{flex-direction:column}.sidebar{width:100%}.content-area{flex-direction:column}.controls-panel{width:100%}.btn-group{flex-direction:row}.btn-group.vertical .btn{width:auto}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>TY语加密器 <span class="version">网页版 3.0</span></h1>
      <p class="subtitle">与桌面版双端互通 · 加密内容可互相加解密</p>
    </header>
    <main class="main">
      <aside class="sidebar">
        <section class="panel keys-panel">
          <h2>密钥管理</h2>
          <div class="session-list-wrap">
            <label>会话</label>
            <ul id="sessionList" class="session-list"></ul>
            <div class="btn-group">
              <button type="button" id="btnAddSession" class="btn btn-secondary">保存会话</button>
              <button type="button" id="btnDelSession" class="btn btn-secondary">删除会话</button>
            </div>
          </div>
          <div class="btn-group vertical">
            <button type="button" id="btnImportSession" class="btn btn-secondary">导入会话</button>
            <button type="button" id="btnExportSession" class="btn btn-secondary">导出会话</button>
          </div>
          <div class="key-actions">
            <button type="button" id="btnImportPub" class="btn btn-secondary">导入公钥</button>
            <button type="button" id="btnImportPriv" class="btn btn-secondary">导入私钥</button>
            <button type="button" id="btnGenKeys" class="btn btn-primary">生成密钥对</button>
          </div>
        </section>
      </aside>
      <section class="content-area">
        <div class="panel main-panel">
          <h2>内容管理</h2>
          <textarea id="txtMain" placeholder="在此输入明文或 TY 语密文..." rows="12"></textarea>
          <div class="panel-footer"><span id="charCount" class="char-count">字符数：0</span></div>
        </div>
        <div class="panel controls-panel">
          <h2>操作</h2>
          <div class="algo-section">
            <label>算法选择</label>
            <div class="radio-group">
              <label class="radio-label"><input type="radio" name="algo" value="x25519" checked> 3.0 全新算法</label>
              <label class="radio-label"><input type="radio" name="algo" value="rsa"> 2.2 旧版算法</label>
            </div>
            <label class="checkbox-label"><input type="checkbox" id="chkCompress" disabled> 压缩密文长度</label>
          </div>
          <div class="btn-group vertical">
            <button type="button" id="btnEncrypt" class="btn btn-primary">加密</button>
            <button type="button" id="btnDecrypt" class="btn btn-primary">解密</button>
            <button type="button" id="btnCopy" class="btn btn-secondary">复制结果</button>
            <button type="button" id="btnClear" class="btn btn-secondary">清空</button>
          </div>
          <button type="button" id="btnSavePreset" class="btn btn-secondary full-width">保存预设</button>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="status" id="statusBar">就绪</div>
      <p class="warning">注意：本版本仅兼容 2.2 版本。本工具严禁用于违法活动，违者后果自行承担！</p>
      <a href="https://lcs123.top" target="_blank" rel="noopener" class="credit">By LCS 2020-2026</a>
    </footer>
  </div>
  <input type="file" id="fileImport" accept=".tysess" hidden>
  <input type="file" id="fileImportPub" accept=".xml,.txt" hidden>
  <input type="file" id="fileImportPriv" accept=".xml,.txt" hidden>

function base64ToArrayBuffer(b64){let s=(b64||'').replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,'');s=s+'='.repeat((4-s.length%4)%4);const binary=atob(s);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes.buffer}
function arrayBufferToBase64(buf){const bytes=new Uint8Array(buf);let binary='';for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary)}
function bytesToWordString(data){const sb=[];for(let i=0;i<data.length;i++){const b=data[i];sb.push(wordList[(b/64)|0],wordList[b&63],'！')}if(sb.length>0)sb.pop();return sb.join('')}
function wordStringToBytes(s){const parts=s.replace(/\s/g,'').split(/[！!]/);const out=[];for(const pair of parts){if(pair.length<4)continue;const hi=wordList.indexOf(pair.substring(0,2));const lo=wordList.indexOf(pair.substring(2,4));if(hi<0||lo<0)throw new Error('请检查输入是否为ty语！');out.push((hi*64+lo)&0xff)}return new Uint8Array(out)}
function bytesToWordString128(data){const sb=[];for(let i=0;i<data.length;i++)sb.push(wordList256[data[i]&0xff]);return sb.join('')}
function wordStringToBytes128(s){s=(s||'').replace(/\s/g,'');if(!s||s.length%2!==0)throw new Error('输入长度不正确：词元应为两字一组');const out=[];for(let i=0;i<s.length;i+=2){const idx=wordList256.indexOf(s.substring(i,i+2));if(idx<0||idx>255)throw new Error('请检查输入是否为ty语！');out.push(idx)}return new Uint8Array(out)}
function compressString(input){const bytes=new TextEncoder().encode(input);if(bytes.length<32)return bytes;try{if(typeof pako!=='undefined'){const c=pako.gzip(bytes);if(c.length<bytes.length)return c}}catch(e){}return bytes}
function decompressBytes(data){try{if(typeof pako!=='undefined'){try{return new TextDecoder().decode(pako.ungzip(new Uint8Array(data)))}catch(e){}try{return new TextDecoder().decode(pako.inflate(new Uint8Array(data)))}catch(e){}}}catch(e){}return new TextDecoder().decode(data)}
async function hkdfSha256(salt,ikm,info,outLen){if(!salt)salt=new Uint8Array(32);const extractKey=await crypto.subtle.importKey('raw',salt,{name:'HMAC',hash:'SHA-256'},false,['sign']);const prk=await crypto.subtle.sign('HMAC',extractKey,ikm);const prkKey=await crypto.subtle.importKey('raw',prk,{name:'HMAC',hash:'SHA-256'},false,['sign']);const okm=[];let prev=new ArrayBuffer(0);let counter=1;while(okm.length<outLen){const data=new Uint8Array(prev.byteLength+info.length+1);data.set(new Uint8Array(prev),0);data.set(info,prev.byteLength);data[data.length-1]=counter;const t=await crypto.subtle.sign('HMAC',prkKey,data);prev=t;okm.push(...new Uint8Array(t));counter++}return new Uint8Array(okm.slice(0,outLen))}
function parseRsaXml(xml){const cleanB64=s=>(s||'').replace(/\s/g,'');const doc=new DOMParser().parseFromString(xml,'text/xml');const getVal=tag=>{const el=doc.getElementsByTagName(tag)[0];return el?(el.textContent||'').trim():null};const modulus=getVal('Modulus'),exponent=getVal('Exponent');if(!modulus||!exponent)throw new Error('无效的 RSA 公钥 XML');const n=base64ToArrayBuffer(cleanB64(modulus)),e=base64ToArrayBuffer(cleanB64(exponent));const b64url=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const jwk={kty:'RSA',n:b64url(n),e:b64url(e)};const p=getVal('P'),q=getVal('Q'),d=getVal('D');if(p&&q&&d){jwk.d=b64url(base64ToArrayBuffer(cleanB64(d)));jwk.p=b64url(base64ToArrayBuffer(cleanB64(p)));jwk.q=b64url(base64ToArrayBuffer(cleanB64(q)));['dp','dq','qi'].forEach((k,i)=>{const v=getVal(['DP','DQ','InverseQ'][i]);if(v)jwk[k]=b64url(base64ToArrayBuffer(cleanB64(v)))})}return jwk}
async function importRsaPublicKey(xml){return crypto.subtle.importKey('jwk',parseRsaXml(xml),{name:'RSA-OAEP',hash:'SHA-256'},true,['encrypt'])}
async function importRsaPrivateKey(xml){return crypto.subtle.importKey('jwk',parseRsaXml(xml),{name:'RSA-OAEP',hash:'SHA-256'},true,['decrypt'])}
async function hybridEncryptRsa(plain,rsaPublicKey){const aesKey=crypto.getRandomValues(new Uint8Array(16)),hmacKey=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(16));const aesKeyObj=await crypto.subtle.importKey('raw',aesKey,{name:'AES-CBC'},false,['encrypt']);const cipher=await crypto.subtle.encrypt({name:'AES-CBC',iv},aesKeyObj,plain);const session=new Uint8Array(32);session.set(aesKey,0);session.set(hmacKey,16);let rsaEnc;try{rsaEnc=await crypto.subtle.encrypt({name:'RSA-OAEP'},rsaPublicKey,session)}catch(e){const jwk=await crypto.subtle.exportKey('jwk',rsaPublicKey);const key=await crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-1'},true,['encrypt']);rsaEnc=await crypto.subtle.encrypt({name:'RSA-OAEP',hash:'SHA-1'},key,session)}const rsaLenBE=new Uint8Array(2);rsaLenBE[0]=(rsaEnc.byteLength>>8)&0xff;rsaLenBE[1]=rsaEnc.byteLength&0xff;const aad=new Uint8Array(1+1+16+2+rsaEnc.byteLength+cipher.byteLength);let off=0;aad[off++]=3;aad[off++]=1;aad.set(iv,off);off+=16;aad.set(rsaLenBE,off);off+=2;aad.set(new Uint8Array(rsaEnc),off);off+=rsaEnc.byteLength;aad.set(new Uint8Array(cipher),off);const hmacKeyObj=await crypto.subtle.importKey('raw',hmacKey,{name:'HMAC',hash:'SHA-256'},false,['sign']);const tag=new Uint8Array((await crypto.subtle.sign('HMAC',hmacKeyObj,aad))).slice(0,16);const packet=new Uint8Array(1+1+16+2+rsaEnc.byteLength+cipher.byteLength+16);off=0;packet[off++]=3;packet[off++]=1;packet.set(iv,off);off+=16;packet.set(rsaLenBE,off);off+=2;packet.set(new Uint8Array(rsaEnc),off);off+=rsaEnc.byteLength;packet.set(new Uint8Array(cipher),off);off+=cipher.byteLength;packet.set(tag,off);return packet}
function toStandardBase64(b64url){if(!b64url)return'';const s=b64url.replace(/-/g,'+').replace(/_/g,'/');return s+'='.repeat((4-s.length%4)%4)}
async function getRsaXmlFromKey(key){const jwk=await crypto.subtle.exportKey('jwk',key);let xml='<RSAKeyValue><Modulus>'+toStandardBase64(jwk.n)+'</Modulus><Exponent>'+toStandardBase64(jwk.e)+'</Exponent>';if(jwk.d){xml+='<P>'+toStandardBase64(jwk.p)+'</P><Q>'+toStandardBase64(jwk.q)+'</Q><DP>'+toStandardBase64(jwk.dp)+'</DP><DQ>'+toStandardBase64(jwk.dq)+'</DQ><InverseQ>'+toStandardBase64(jwk.qi)+'</InverseQ><D>'+toStandardBase64(jwk.d)+'</D>'}return xml+'</RSAKeyValue>'}

async function btnGenKeys(){try{setStatus('正在生成密钥对...');let pub,priv;if(isX25519()){const kp=await TyCrypto.generateX25519KeyPair();pub=kp.publicBase64;priv=kp.privateBase64}else{const kp=await TyCrypto.generateRsaKeyPair();pub=kp.publicXml;priv=kp.privateXml}publicKeyXml=pub;privateKeyXml=priv;sessionList.querySelectorAll('li').forEach(el=>el.classList.remove('active'));setStatus('密钥对已生成。可点击「保存会话」将此密钥保存到会话列表。')}catch(e){setStatus('生成失败');alert('生成密钥失败：'+e.message)}}
function btnAddSession(){const name=prompt('请输入会话名称','新会话');if(!name||!name.trim())return;if(!publicKeyXml||!privateKeyXml){alert('当前没有可保存的密钥，请先生成或导入公私钥。');return}sessions.push({name:name.trim(),publicXml:publicKeyXml,privateXml:privateKeyXml,algorithmType:isX25519()?1:0,doUseCompress:getCompress()});saveSessions();renderSessions();selectSession(sessions.length-1);setStatus('会话 '+name+' 已保存并激活。')}

async function btnEncrypt(){if(!publicKeyXml){alert('要加密，请先导入或生成公钥');return}const keyIsX19=publicKeyXml.startsWith('X25519:');if(isX25519()!==keyIsX19){alert('所选算法与当前密钥类型不匹配！当前是'+(keyIsX19?'X25519 新算法':'RSA 旧算法')+'密钥。请切换算法选项或重新生成/导入对应类型的密钥。');return}const t=txtMain.value.trim();if(!t){setStatus('请输入要加密的内容');return}try{setStatus('加密中...');const r=await TyCrypto.encryptToWords(t,isX25519()||getCompress(),publicKeyXml);txtMain.value=r;updateCharCount();setStatus('加密完成')}catch(e){setStatus('加密失败');alert('加密失败：'+e.message)}}
async function btnDecrypt(){if(!privateKeyXml){alert('要解密，请先导入或生成私钥');return}const keyIsX19=privateKeyXml.startsWith('X25519:');if(isX25519()!==keyIsX19){alert('所选算法与当前密钥类型不匹配！当前是'+(keyIsX19?'X25519 新算法':'RSA 旧算法')+'密钥。请切换算法选项或重新导入对应类型的密钥。');return}const t=txtMain.value.trim();if(!t){setStatus('请输入要解密的 TY 语');return}try{setStatus('解密中...');const r=await TyCrypto.decryptFromWords(t,isX25519()||getCompress(),privateKeyXml);txtMain.value=r;updateCharCount();setStatus('解密完成')}catch(e){setStatus('解密失败');alert('解密失败：'+e.message+'\n\n请确保：1)密文完整无删改 2)使用加密时的同一把私钥 3)若从别处复制，检查是否有不可见字符')}}
function btnCopy(){txtMain.select();document.execCommand('copy');setStatus('已复制。')}
function btnClear(){txtMain.value='';updateCharCount();setStatus('已清空。')}

function loadPreset(){if(sessions.length>0)return;try{const r=localStorage.getItem(PRESET_KEY);if(r){const p=JSON.parse(r);const rb=document.querySelector('input[name="algo"][value="'+p.algo+'"]');if(rb)rb.checked=true;chkCompress.checked=!!p.compress}}catch(e){}}
async function decryptTysessPassword(enc,pwd){const itb=new DataView(enc.buffer,enc.byteOffset+7,4);const iterations=itb.getUint32(0,false),salt=enc.slice(11,27),nonce=enc.slice(27,39),tag=enc.slice(enc.length-16),cipher=enc.slice(39,enc.length-16);const pwKey=await deriveKey(pwd,salt,iterations);const key=await crypto.subtle.importKey('raw',pwKey,{name:'AES-GCM'},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce,tagLength:128},key,new Uint8Array([...cipher,...tag]).buffer);return new TextDecoder('utf-8').decode(plain)}

fileImport.onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';try{const bytes=await f.arrayBuffer(),arr=new Uint8Array(bytes);let content=null;if(arr.length>=7&&String.fromCharCode.apply(null,arr.slice(0,7))==='TYSESS1'){const pwd=prompt('请输入用于加密会话文件的密码：','');if(pwd==null){setStatus('导入已取消。');return}try{content=await decryptTysessPassword(arr,pwd)}catch(err){alert('解密会话文件失败，请检查密码');return}}if(!content)content=new TextDecoder('utf-8').decode(bytes);const lines=content.split(/\r?\n/);if(lines.length<5)throw new Error('文件格式错误');const h=lines[0].split('|');if(h.length<3)throw new Error('文件格式错误');const ext=(sm,em)=>{const si=lines.indexOf(sm);if(si<0)throw new Error('文件格式错误');const ei=em?lines.indexOf(em,si+1):lines.length;if(em&&ei<0)throw new Error('文件格式错误');return lines.slice(si+1,em?ei:lines.length).join('\n')};sessions.push({name:h[0],algorithmType:parseInt(h[1],10)||0,doUseCompress:h[2]==='1',publicXml:ext('----PUB----','----PRIV----'),privateXml:ext('----PRIV----',null)});saveSessions();renderSessions();selectSession(sessions.length-1);setStatus('会话已导入。')}catch(err){alert('导入失败：'+err.message)}}
